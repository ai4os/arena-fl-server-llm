[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena-fedllm"
version = "1.0.0"
description = "Federated fine-tuning with Flower (server)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.30.0",
    "flwr-datasets>=0.3.0",
    "torch>=2.3.0",
    "transformers>=4.48.0", 
    "trl==0.11.3",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0", 
    "accelerate>=1.0.0",
    "scipy>=1.13.0",
    "sentencepiece>=0.2.0",
    "omegaconf>=2.3.0",
    "hf_transfer>=0.1.8",
    "huggingface_hub>=0.26.0",
]

[tool.hatch.build.targets.wheel]
packages = ["arena_fedllm"]

[tool.flwr.app]
publisher = "arena"

[tool.flwr.app.components]
serverapp = "arena_fedllm.server_app:app"
clientapp = "arena_fedllm.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3

# NOTE: there is no central `dataset.name` here. In this deployment 
# each client machine points at its OWN local CSV file when it's
# launched never at a shared/central path. 
# That keeps each site's data on that site's machine only.

# Base model pulled from the Hugging Face Hub.
# gated repo: accept the license on its model page and set the HF_TOKEN
# environment variable before running.
model.name = "Qwen/Qwen3.5-0.8B"
model.quantization = 4
model.gradient-checkpointing = true
model.lora.peft-lora-r = 32
model.lora.peft-lora-alpha = 64

train.save-every-round = 1
train.learning-rate-max = 5e-5
train.learning-rate-min = 1e-6
train.seq-length = 512
train.training-arguments.output-dir = ""
train.training-arguments.learning-rate = 5e-5
train.training-arguments.per-device-train-batch-size = 4
train.training-arguments.gradient-accumulation-steps = 4
train.training-arguments.logging-steps = 10
train.training-arguments.num-train-epochs = 3
train.training-arguments.max-steps = -1
train.training-arguments.save-steps = 1000
train.training-arguments.save-total-limit = 1
train.training-arguments.gradient-checkpointing = true
train.training-arguments.lr-scheduler-type = "constant"
train.training-arguments.report-to = "none"

strategy.fraction-train = 0.2
strategy.fraction-evaluate = 0.0
