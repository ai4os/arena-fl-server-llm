metadata_version: 1.0.0
title: ARENA FlowerTune LLM server
summary: Run a federated learning server for fine-tuning large language models with Flower.
description: |-
  Federated learning server for fine-tuning large language models using Flower.
  This server (SuperLink) runs the Flower SuperLink process that accepts connections from clients (SuperNodes).
  After the SuperLink is running on the server side and the clients (SuperNodes) have connected, the federated run
  can start from the server container using the Flower CLI.

  The following environment variables can be configured from the dashboard:

  | Variable | Default |
  | --- | --- |
  | `NUM_ROUNDS` | `10` |
  | `MODEL_NAME` | `Qwen/Qwen2.5-0.5B` |
  | `MODEL_QUANTIZATION` | `4` |
  | `NUM_EPOCHS` | `3` |
  | `FRACTION_TRAIN` | `0.2` |
  | `FRACTION_EVALUATE` | `0.0` |

